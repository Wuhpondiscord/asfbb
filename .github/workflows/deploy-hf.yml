name: Deploy to Hugging Face
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: hf-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
        run: |
          set -eu
          test -n "$HF_TOKEN"
          test -n "$HF_SPACE_REPO"
          case "$HF_SPACE_REPO" in */*) ;; *) exit 1;; esac
          git remote add hf "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}"
          git push --force hf HEAD:main
