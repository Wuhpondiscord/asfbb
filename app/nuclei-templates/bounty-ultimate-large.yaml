id: bounty-ultimate-large
info:
  name: Bounty Ultimate - Large
  author: asfb
  severity: info
  description: Medium paths plus extended GET-only exposure checks. Higher request volume.
  tags: bounty,recon,exposure,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/.git/config"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'repositoryformatversion'

  - method: GET
    path:
      - "{{BaseURL}}/.git/HEAD"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'ref: refs/heads/'

  - method: GET
    path:
      - "{{BaseURL}}/swagger.json"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'swagger'

  - method: GET
    path:
      - "{{BaseURL}}/openapi.json"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'openapi'

  - method: GET
    path:
      - "{{BaseURL}}/phpinfo.php"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'PHP Version'

  - method: GET
    path:
      - "{{BaseURL}}/actuator/health"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'status'

  - method: GET
    path:
      - "{{BaseURL}}/.env"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'APP_KEY='

  - method: GET
    path:
      - "{{BaseURL}}/backup.sql"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'CREATE TABLE'

  - method: GET
    path:
      - "{{BaseURL}}/server-status"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'Apache Server Status'

  - method: GET
    path:
      - "{{BaseURL}}/v3/api-docs"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'openapi'

  - method: GET
    path:
      - "{{BaseURL}}/wp-content/debug.log"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'PHP'

  - method: GET
    path:
      - "{{BaseURL}}/graphql"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'GraphQL'

  - method: GET
    path:
      - "{{BaseURL}}/appsettings.json"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'ConnectionStrings'

  - method: GET
    path:
      - "{{BaseURL}}/docker-compose.yml"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'services:'

  - method: GET
    path:
      - "{{BaseURL}}/terraform.tfstate"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'terraform_version'

  - method: GET
    path:
      - "{{BaseURL}}/.gitlab-ci.yml"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'stages:'

  - method: GET
    path:
      - "{{BaseURL}}/debug/pprof/"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'Types of profiles available'

  - method: GET
    path:
      - "{{BaseURL}}/main.js.map"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'mappings'

  - method: GET
    path:
      - "{{BaseURL}}/logs/error.log"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - 'ERROR'

  - method: GET
    path:
      - "{{BaseURL}}/metrics"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: body
        words:
          - '# HELP'
